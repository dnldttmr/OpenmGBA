<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OpenmGBA</title>
    <script>
      // GitHub Pages serves this file for any unmatched path (no server-side
      // rewrites are possible on static Pages hosting). Redirect to
      // index.html with the real path encoded in the query string, so the
      // app can restore it client-side and the router picks up where the
      // link pointed. Standard technique: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
